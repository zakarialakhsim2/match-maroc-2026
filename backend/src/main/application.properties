# App
spring.application.name=match-maroc-2026
server.port=${PORT:8080}

# Database - supports both Railway's DATABASE_URL and custom DB_URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchmaroc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Mail - disable autoconfiguration if not configured
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
