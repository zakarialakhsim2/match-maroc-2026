# App
spring.application.name=match-maroc-2026
server.port=8080

# Database — Railway injecte DATABASE_URL au format postgresql://user:pass@host:port/db
# On accepte aussi DB_URL/DB_USER/DB_PASSWORD pour le local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/matchmaroc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
