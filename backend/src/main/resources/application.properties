Exécuté 2 commandes, consulté un fichier
Exécuté 2 commandes, consulté un fichier
The bug is clear. The repository method findNextMoroccoMatch is declared to return Optional<Match>, but the JPQL query can return multiple results (it uses ORDER BY but no LIMIT). Spring Data JPA tries to call getSingleResult() on it, which fails when there are 3 upcoming Morocco matches.

The fix: change the return type to List<Match> and take the first element, or add a LIMIT 1 via a proper Spring Data approach. The cleanest fix is to change the query method to return a List<Match> and pick the first one in the service.

Here are the two files to fix:

MatchRepository.java — change return type to List<Match>:

java
@Query("SELECT m FROM Match m WHERE (m.teamA = 'Maroc' OR m.teamB = 'Maroc') AND m.dateTimeUtc > :now ORDER BY m.dateTimeUtc ASC")
List<Match> findNextMoroccoMatch(Instant now);
MatchService.java — take the first element from the list:

java
public MatchDto getNextMatch() {
    List<Match> matches = matchRepository.findNextMoroccoMatch(Instant.now());
    if (matches.isEmpty()) {
        throw new RuntimeException("Aucun match à venir");
    }
    return toDto(matches.get(0));
}
Why this happens: The JPQL ORDER BY doesn't limit results to one row — it just sorts them. So when there are 3 upcoming Morocco matches in the DB, the query returns all 3, and Spring Data's Optional<T> mapping calls getSingleResult() which throws NonUniqueResultException if more than one row comes back.

Alternative fix (if you want to keep Optional<Match>): use Spring Data's Pageable approach:

java
// In repository
@Query("SELECT m FROM Match m WHERE (m.teamA = 'Maroc' OR m.teamB = 'Maroc') AND m.dateTimeUtc > :now ORDER BY m.dateTimeUtc ASC")
List<Match> findNextMoroccoMatch(Instant now, Pageable pageable);

// In service
matchRepository.findNextMoroccoMatch(Instant.now(), PageRequest.of(0, 1))
    .stream().findFirst()
    .orElseThrow(...);
The List<Match> approach is the simplest — just make those two changes in your project and restart the backend.

